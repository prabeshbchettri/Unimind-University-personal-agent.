server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall through to index.html.
    location / {
        try_files $uri /index.html;
    }

    # API: strip the /api prefix (matching the Vite dev proxy) and forward
    # to the backend container. Long timeouts: answer generation can take a
    # while when an LLM is attached.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}